name: Diagnostic compteur
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://abacus.jasoncameron.dev
          {
          for k in appareils jour-20261017 essai; do echo "$k: $(curl -s -m 20 $B/get/cefstv-kpan/$k)"; done
          for m in 0 5 10 15 20 25 30 35 40 45 50 55; do H=$(date -u +%Y%m%d%H); k=ecoute-$H$(printf %02d $m); echo "$k: $(curl -s -m 20 $B/get/cefstv-kpan/$k)"; done
          echo "== hit with Origin"; curl -s -m 20 -i -H "Origin: https://kpanguirat5766-cefs.github.io" "$B/hit/cefstv-kpan/essai" | grep -i -E "^HTTP|access-control|value"
          echo "== info"; curl -s -m 20 "$B/info/cefstv-kpan/appareils"
          } > tools/diag.txt 2>&1
          git config user.name "CEFS TV"; git config user.email "actions@users.noreply.github.com"
          git add tools/diag.txt; git commit -m diag && git push
