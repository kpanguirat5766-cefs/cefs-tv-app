name: Tester le compteur
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
          echo "== abacus hit"; curl -s -m 20 -i "https://abacus.jasoncameron.dev/hit/cefstv-kpan/essai" | head -20
          echo; echo "== abacus get"; curl -s -m 20 -i -H "Origin: https://kpanguirat5766-cefs.github.io" "https://abacus.jasoncameron.dev/get/cefstv-kpan/essai" | head -20
          echo; echo "== counterapi up"; curl -s -m 20 -i "https://api.counterapi.dev/v1/cefstv-kpan/essai/up" | head -20
          } > tools/test-compteur.txt 2>&1
          git config user.name "CEFS TV"; git config user.email "actions@users.noreply.github.com"
          git add tools/test-compteur.txt; git commit -m "test compteur" && git push
