name: t4
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - > tools/t4.txt 2>&1 <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          x = urllib.request.urlopen(urllib.request.Request("https://www.youtube.com/feeds/videos.xml?channel_id=UCnvTy82aj_ccPjYH68fwCBQ", headers={"User-Agent":"Mozilla/5.0"}), timeout=30).read()
          ns = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}
          for e in ET.fromstring(x).findall("a:entry", ns)[:5]:
              print(e.findtext("yt:videoId", namespaces=ns), e.findtext("a:published", namespaces=ns), e.findtext("a:title", namespaces=ns))
          PY
          git config user.name "CEFS TV"; git config user.email "actions@users.noreply.github.com"
          git add tools/t4.txt; git commit -m t4 && git push
