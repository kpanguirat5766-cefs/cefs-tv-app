name: Construire l'APK CEFS TV

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "desktop/**"
      - ".github/workflows/pc.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "Lien public de la page CEFS TV (laisser vide pour garder celui de gradle.properties)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compiler l'APK
        env:
          CEFS_URL: ${{ github.event.inputs.url }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ARGS="-Pcefs.versionCode=${{ github.run_number }}"
          if [ -n "$CEFS_URL" ]; then ARGS="$ARGS -Pcefs.url=$CEFS_URL"; fi
          gradle --no-daemon assembleRelease bundleRelease $ARGS
          cp app/build/outputs/apk/release/app-release.apk "CEFS-TV.apk"
          cp app/build/outputs/bundle/release/app-release.aab "CEFS-TV-PlayStore.aab"

      - name: Publier l'APK au téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: CEFS TV 1.${{ github.run_number }}
          body: |
            Application Android CEFS TV.
            Téléchargez CEFS-TV.apk ci-dessous, ouvrez-le sur votre téléphone et autorisez l'installation.
          files: |
            CEFS-TV.apk
            CEFS-TV-PlayStore.aab
          make_latest: true
