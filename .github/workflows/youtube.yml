name: Nouvelles vidéos YouTube

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter les nouvelles vidéos de la chaîne
        run: python3 tools/import_youtube.py
      - name: Enregistrer
        run: |
          git config user.name "CEFS TV"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/tv.json
          git diff --cached --quiet && exit 0
          git commit -m "Nouvelles vidéos de la chaîne YouTube"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
