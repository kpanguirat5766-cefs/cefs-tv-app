name: t2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://abacus.jasoncameron.dev; K=essai-$RANDOM$RANDOM
          {
          echo "== create"; C=$(curl -s -m 20 "$B/create/cefstv-kpan/$K?initializer=0"); echo "$C" | sed 's/"admin_key":"[^"]*"/"admin_key":"(cache)"/'
          A=$(echo "$C" | python3 -c "import sys,json;print(json.load(sys.stdin).get('admin_key',''))")
          for u in "set/cefstv-kpan/$K?value=123456" "update/cefstv-kpan/$K?value=5" "reset/cefstv-kpan/$K"; do
            for m in GET POST; do echo "== $m $u"; curl -s -m 20 -X $m -H "Authorization: Bearer $A" "$B/$u"; echo; done; done
          echo "== set no auth"; curl -s -m 20 -X POST "$B/set/cefstv-kpan/$K?value=7"; echo
          echo; echo "== get"; curl -s -m 20 "$B/get/cefstv-kpan/$K"
          echo; echo "== create again"; curl -s -m 20 "$B/create/cefstv-kpan/$K"
          echo; echo "== preflight"; curl -s -m 20 -i -X OPTIONS -H "Origin: https://kpanguirat5766-cefs.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization" "$B/set/cefstv-kpan/$K?value=1" | grep -i "^HTTP\|access-control"
          echo; echo "== channel"; curl -s -m 20 -A "Mozilla/5.0" -H "Cookie: CONSENT=YES+1" "https://www.youtube.com/@guiratkpan" | grep -o '"externalId":"[^"]*"\|"channelId":"UC[^"]*"' | sort | uniq -c | head
          curl -s -m 20 -A "Mozilla/5.0" "https://www.youtube.com/@guiratkpan" | grep -o 'channel/UC[A-Za-z0-9_-]\{22\}' | sort | uniq -c | head
          } > tools/t3.txt 2>&1
          git config user.name "CEFS TV"; git config user.email "actions@users.noreply.github.com"
          git add tools/t3.txt; git commit -m t2 && git push
