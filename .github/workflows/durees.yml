name: Mesurer la durée des vidéos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  durees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire les durées sur YouTube
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          d = json.load(open("docs/data/tv.json"))
          out = {}
          for v in d["videos"]:
              if v.get("src") != "youtube": continue
              try:
                  req = urllib.request.Request("https://www.youtube.com/watch?v=" + v["yt"] + "&hl=fr",
                      headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                               "Accept-Language": "fr-FR,fr;q=0.9", "Cookie": "CONSENT=YES+1"})
                  html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
                  m = re.search(r'"lengthSeconds":"(\d+)"', html) or re.search(r'"approxDurationMs":"(\d+)"', html)
                  out[v["yt"]] = int(m.group(1)) if m and "lengthSeconds" in m.group(0) else (int(m.group(1))//1000 if m else 0)
              except Exception as e:
                  out[v["yt"]] = "ERR " + str(e)[:60]
          print("DUREES=" + json.dumps(out))
          json.dump(out, open("docs/data/durees.json", "w"), ensure_ascii=False, indent=1)
          n = 0
          for v in d["videos"]:
              x = out.get(v.get("yt"))
              if isinstance(x, int) and x > 0 and v.get("dur") != x: v["dur"] = x; n += 1
          if n:
              import time; d["rev"] = int(time.time()*1000)
              json.dump(d, open("docs/data/tv.json", "w"), ensure_ascii=False)
          PY
      - name: Enregistrer
        run: |
          git config user.name "CEFS TV"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Durées des vidéos mises à jour" && git push)
