name: Mesurer la durée des vidéos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  durees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lire les durées avec le lecteur YouTube
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node tools/durees.mjs
      - name: Enregistrer
        run: |
          git config user.name "CEFS TV"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Durées des vidéos mises à jour" && git push)
